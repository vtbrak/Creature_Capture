# Conda environment for Creature Capture (macOS and Windows).
# Created/updated by install_mac.command / install_windows.bat.
# Uses conda-forge only (no Anaconda "defaults" channel, so no Terms-of-Service prompt).
name: creature_capture
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - PySide6>=6.6,<6.11
      - opencv-python-headless>=4.9,<5
      - numpy>=1.26
      - imageio-ffmpeg>=0.5  # bundles FFmpeg, including the NVIDIA encoder
      - pytest>=8
